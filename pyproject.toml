[project]
name = "nano-offline"
version = "0.7.2"
description = "Nano offline accounting and inventory suite built with Flet"
requires-python = ">=3.10"
dependencies = [
  "flet==0.28.3",
  "flet-native-files==0.1.1",
]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.flet]
org = "com.nano"
product = "Nano | نانو"
company = "Nano"
copyright = "Copyright © 2026"
build_number = 9
android_permissions = [
  "android.permission.INTERNET",
]

[tool.flet.app]
path = "src"
module = "main"

[tool.flet.splash]
color = "#0B63F6"
dark_color = "#0A2E78"
android = true
ios = true
web = true

[tool.flet.android]
adaptive_icon_background = "#0B63F6"

[tool.flet.android.manifest_application]
allowBackup = "false"

[tool.flet.android.permission]
"android.permission.INTERNET" = true

[tool.flet.dev_packages]
"flet-native-files" = "extensions/flet_native_files"
