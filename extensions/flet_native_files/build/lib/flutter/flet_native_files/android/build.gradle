group 'com.nano.homewidget'
version '1.0'

buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.nano.homewidget'
    compileSdk 34

    defaultConfig {
        // Must not exceed the app module's own minSdkVersion (21, set by
        // Flet from pyproject.toml) -- Gradle's manifest merger hard-fails
        // otherwise ("uses-sdk:minSdkVersion 21 cannot be smaller than
        // version 23 declared in library [:flet_native_files]"). Nothing
        // in this module actually requires API 23+: the one component
        // that needs a newer API (NanoQuickSettingsTileService, API 24)
        // already guards itself with @RequiresApi + a runtime SDK_INT
        // check, so the OS simply never discovers/binds it on pre-24
        // devices instead of crashing.
        minSdk 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }
}

dependencies {
    // Jetpack Glance: the modern, Compose-based widget toolkit this whole
    // PHASE10 note is built around (see PHASE10_HOME_WIDGET_GLANCE_AR.md's
    // "لماذا Jetpack Glance تحديدًا"). glance-appwidget pulls the core
    // Glance + AppWidget integration; the plain compose runtime dependency
    // is required for Glance's @Composable content, not for any regular UI.
    implementation "androidx.glance:glance-appwidget:1.1.0"
    implementation "androidx.glance:glance-material3:1.1.0"
    implementation "androidx.compose.ui:ui-graphics:1.6.1"
    // Required separately from ui-graphics above: the `.dp` unit extension
    // used for Glance padding/height/spacer sizing lives in this module,
    // not in ui-graphics, and isn't pulled in transitively as an api dep.
    implementation "androidx.compose.ui:ui-unit:1.6.1"
    implementation "androidx.datastore:datastore-preferences:1.0.0"
    implementation "androidx.annotation:annotation:1.7.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
}
