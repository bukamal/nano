# Fast quality gate (no Android SDK). Runs on every PR touching Python sources.
name: Quality Gate

on:
  pull_request:
    paths:
      - "src/**"
      - "apps/**"
      - "tools/**"
      - "pyproject.toml"
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "apps/**"
      - "tools/**"

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false

      - name: Install project
        run: |
          uv sync
          uv pip install -e extensions/flet_native_files
          uv pip install -e .

      - name: Suite import smoke
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          # Verify multi-app entry points import without launching UI
          import importlib
          for mod in (
              "nano_offline.bootstrap",
              "nano_offline.suite.accounting_app",
              "nano_offline.suite.inventory_app",
              "nano_offline.suite.pos_app",
          ):
              importlib.import_module(mod)
              print("OK", mod)
          from nano_offline.core.paths import database_path, app_data_dir
          print("db path helper:", database_path())
          print("data dir:", app_data_dir())
          PY

      - name: Quality gate script
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          # Run in the SAME interpreter uv just provisioned packages into,
          # without `uv run` (it re-resolves the lockfile and can silently
          # swap to a different Python than the one deps were installed in).
          VENV_PY="$(find .venv -name python -type f -o -name python3 -type f 2>/dev/null | head -1 || true)"
          if [ -n "$VENV_PY" ]; then
            PYTHONPATH=src "$VENV_PY" tools/quality_gate.py
          else
            PYTHONPATH=src python tools/quality_gate.py
          fi
