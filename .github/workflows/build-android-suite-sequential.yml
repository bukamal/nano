# Builds all three suite APKs sequentially in ONE job.
# Use this if the parallel matrix workflow only produced one artifact for you.
name: Build Android Suite APKs (Sequential)

on:
  workflow_dispatch:

concurrency:
  group: android-suite-seq-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-all:
    name: Build accounting + inventory + pos
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0" "cmdline-tools;latest"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Verify suite files
        run: |
          set -euo pipefail
          ls -la src/main_accounting.py src/main_inventory.py src/main_pos.py
          ls -la src/nano_offline/suite/
          chmod +x apps/build_suite_apk.sh

      - name: Build accounting
        env:
          FLET_CLI_NO_RICH_OUTPUT: "1"
          FLET_CLI_SKIP_FLUTTER_DOCTOR: "1"
          SKIP_FLUTTER_DOCTOR: "1"
        run: ./apps/build_suite_apk.sh accounting

      - name: Build inventory
        env:
          FLET_CLI_NO_RICH_OUTPUT: "1"
          FLET_CLI_SKIP_FLUTTER_DOCTOR: "1"
          SKIP_FLUTTER_DOCTOR: "1"
        run: ./apps/build_suite_apk.sh inventory

      - name: Build pos
        env:
          FLET_CLI_NO_RICH_OUTPUT: "1"
          FLET_CLI_SKIP_FLUTTER_DOCTOR: "1"
          SKIP_FLUTTER_DOCTOR: "1"
        run: ./apps/build_suite_apk.sh pos

      - name: List outputs
        if: always()
        run: |
          ls -lah dist/ || true
          find dist -name '*.apk' -exec ls -lah {} \; || true

      - name: Upload all three APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nano-suite-three-apks
          path: |
            dist/nano-accounting-release.apk
            dist/nano-inventory-release.apk
            dist/nano-pos-release.apk
            dist/*-build-info.txt
            flet-build-*.log
          if-no-files-found: warn
          retention-days: 14
