# Builds THREE separate APKs (accounting / inventory / pos) in parallel.
# Each matrix job is independent and uploads its own artifact.
name: Build Android Suite APKs

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "Comma-separated: accounting,inventory,pos — or all"
        required: false
        default: "all"
  push:
    branches: [main, master]
    tags:
      - "v*"
      - "suite-v*"
  pull_request:
    paths:
      - "src/**"
      - "apps/**"
      - "extensions/**"
      - "pyproject.toml"
      - ".github/workflows/build-android-suite.yml"

concurrency:
  group: android-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-suite:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: accounting
            apk: nano-accounting-release.apk
          - app: inventory
            apk: nano-inventory-release.apk
          - app: pos
            apk: nano-pos-release.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether to build this app
        id: gate
        shell: bash
        run: |
          INPUT="${{ github.event.inputs.apps }}"
          if [ -z "$INPUT" ]; then INPUT="all"; fi
          echo "Requested apps input: '$INPUT'"
          if [ "$INPUT" = "all" ] || echo ",$INPUT," | grep -q ",${{ matrix.app }},"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Will build: ${{ matrix.app }}"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: ${{ matrix.app }}"
          fi

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 17
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.gate.outputs.run == 'true'
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0" "cmdline-tools;latest"

      - name: Install uv
        if: steps.gate.outputs.run == 'true'
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false

      - name: Verify entry points
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          echo "Listing entry points:"
          ls -la src/main*.py
          test -f "src/main_${{ matrix.app }}.py"
          test -f "src/nano_offline/suite/${{ matrix.app }}_app.py"
          test -f "src/nano_offline/bootstrap.py"
          test -x apps/build_suite_apk.sh || chmod +x apps/build_suite_apk.sh
          head -5 "src/main_${{ matrix.app }}.py"

      - name: Build ${{ matrix.app }} APK
        if: steps.gate.outputs.run == 'true'
        env:
          FLET_CLI_NO_RICH_OUTPUT: "1"
          FLET_CLI_SKIP_FLUTTER_DOCTOR: "1"
          SKIP_FLUTTER_DOCTOR: "1"
        run: |
          set -euo pipefail
          chmod +x apps/build_suite_apk.sh
          ./apps/build_suite_apk.sh "${{ matrix.app }}"
          echo "---- dist after build ----"
          ls -la dist/ || true
          test -f "dist/${{ matrix.apk }}"

      - name: Upload ${{ matrix.app }} APK
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nano-${{ matrix.app }}-apk
          path: |
            dist/${{ matrix.apk }}
            dist/nano-${{ matrix.app }}.apk
            dist/${{ matrix.app }}-build-info.txt
            flet-build-${{ matrix.app }}.log
          if-no-files-found: warn
          retention-days: 14

  package-all:
    name: Bundle all suite APKs
    needs: build-suite
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nano-*-apk
          path: collected
          merge-multiple: false

      - name: Show tree
        run: |
          find collected -type f | sort || true
          echo "----"
          find collected -name '*.apk' | sort || true

      - name: Upload combined bundle
        uses: actions/upload-artifact@v4
        with:
          name: nano-suite-all-apks
          path: collected
          if-no-files-found: warn
          retention-days: 14
