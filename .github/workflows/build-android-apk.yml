# Builds the FULL single-package Nano app only (com.nano).
# For the three separate suite APKs use: Build Android Suite APKs
name: Build Android APK (Full only)

on:
  workflow_dispatch:
  push:
    tags:
      - "full-v*"

concurrency:
  group: android-apk-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Full APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0" "cmdline-tools;latest"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false

      - name: Build full APK
        env:
          FLET_CLI_NO_RICH_OUTPUT: "1"
          FLET_CLI_SKIP_FLUTTER_DOCTOR: "1"
          SKIP_FLUTTER_DOCTOR: "1"
        run: |
          set -euo pipefail
          chmod +x apps/build_suite_apk.sh
          ./apps/build_suite_apk.sh full
          ls -la dist/

      - name: Upload full APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nano-full-apk
          path: |
            dist/nano-release.apk
            dist/nano-full.apk
            dist/full-build-info.txt
            flet-build-full.log
          if-no-files-found: warn
          retention-days: 14
