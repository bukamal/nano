name: Build Qeid Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=65" wheel
          python -m pip install -e extensions/flet_native_files
          python -m pip install -e .
          python - <<'PY'
          import flet, sys
          print("Python:", sys.version)
          print("Flet:", getattr(flet, "__version__", "unknown"))
          PY

      - name: Quality gate
        run: |
          PYTHONPATH=src python tools/quality_gate.py

      - name: Android release preflight
        run: |
          PYTHONPATH=src python tools/apk_release_preflight.py

      - name: Build APK
        run: |
          rm -rf build/flutter build/apk
          flet build apk --verbose --clear-cache \
            --product "قيد - أوفلاين" \
            --org com.qeid \
            --build-number 7 \
            --build-version 0.7.0

      - name: Verify native files extension registration
        run: |
          python tools/verify_flet_native_files_registration.py build/flutter

      - name: Collect APK
        run: |
          APK_PATH=$(find build -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found"
            find build -maxdepth 6 -type f || true
            exit 1
          fi
          mkdir -p build/apk/release
          cp "$APK_PATH" build/apk/release/qeid-offline-release.apk
          ls -lh build/apk/release/qeid-offline-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qeid-offline-apk
          path: build/apk/release/qeid-offline-release.apk
