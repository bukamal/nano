# Build the full Nano app (single APK) — original entry point src/main.py
name: Build Android APK (Full)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "src/**"
      - "extensions/**"
      - "pyproject.toml"
      - "build_nano_apk.sh"
      - ".github/workflows/build-android-apk.yml"

concurrency:
  group: android-apk-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Full APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0" "cmdline-tools;latest"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Build full APK
        env:
          FLET_CLI_NO_RICH_OUTPUT: "1"
          FLET_CLI_SKIP_FLUTTER_DOCTOR: "1"
          SKIP_FLUTTER_DOCTOR: "1"
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          set -euo pipefail
          chmod +x apps/build_suite_apk.sh 2>/dev/null || true
          if [ -x apps/build_suite_apk.sh ]; then
            ./apps/build_suite_apk.sh full
          else
            # Fallback to legacy script if suite helper is not present
            chmod +x build_nano_apk.sh
            ./build_nano_apk.sh
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nano-full-apk
          path: |
            dist/*.apk
            flet-build*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nano-full-flet-build-log
          path: flet-build*.log
          if-no-files-found: ignore
          retention-days: 7
