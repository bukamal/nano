name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: '17'
      - name: Prepare Android SDK and accept licenses
        shell: bash
        run: |
          export SDK_ROOT="$ANDROID_SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;34.0.0"
      - name: Install dependencies
        run: |
          pip install -e extensions/flet_native_files
          pip install flet==0.28.3
      - name: Run quality gate
        run: PYTHONPATH=src python tools/quality_gate.py
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          flet build apk --build-version 0.8.1 --build-number 14 --skip-flutter-doctor 2>&1 | tee flet-build.log
        env:
          ANDROID_SDK_ROOT: "$SDK_ROOT"
          FLET_CLI_SKIP_FLUTTER_DOCTOR: "1"
          FLET_CLI_NO_RICH_OUTPUT: "1"
      - name: Verify native files
        run: python tools/verify_flet_native_files_registration.py build/flutter
      - name: Copy release APK
        run: |
          apk=$(find build/apk -name '*.apk' | head -1)
          [ -n "$apk" ] && cp "$apk" dist/nano-release.apk
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nano-release
          path: dist/nano-release.apk
